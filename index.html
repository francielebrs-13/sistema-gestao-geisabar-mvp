<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geisa Bar - Portal de Acesso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .mobile-container {
            width: 100%;
            max-width: 414px;
            background-color: #ffffff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area { font-size: 24px; font-weight: 800; color: #111; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #666; }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 12px;
        }

        .btn-profile {
            width: 100%;
            background-color: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            color: #111;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
        }

        .btn-profile:hover { border-color: #d4af37; background-color: #fffdf5; }
        .btn-profile.atendente { border-color: #ff6b00; background-color: #ffffff; }
        .btn-profile.atendente:hover { background-color: #fff8f0; }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header-brand">
            <div class="logo-area">🍺 Geisa Bar</div>
            <div class="subtitle">Sistema de Gestão e Pedidos • MVP</div>
        </div>

        <div class="section-title">Selecione o seu perfil de acesso:</div>

        <!-- Perfil Cliente -->
        <a href="carrinho.html" class="btn-profile">
            <div>
                <div style="font-size: 16px; color: #111;">📱 Cliente (Mesa 04)</div>
                <div style="font-size: 12px; color: #666; font-weight: normal; margin-top: 2px;">Cardápio e envio de pedidos</div>
            </div>
            <span style="color: #666;">→</span>
        </a>

        <!-- Perfil Atendente (Leva para a tela de login dedicada) -->
        <a href="login.html" class="btn-profile atendente">
            <div>
                <div style="font-size: 16px; color: #ff6b00;">🔒 Atendente / Balcão</div>
                <div style="font-size: 12px; color: #666; font-weight: normal; margin-top: 2px;">Acesso restrito à equipe</div>
            </div>
            <span style="color: #ff6b00;">→</span>
        </a>

        <div class="footer-note">
            Segurança acadêmica • Controle de acesso RBAC
        </div>
    </div>

</body>
</html>
