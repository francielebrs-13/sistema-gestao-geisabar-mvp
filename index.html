<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geisa Bar - Resumo do Pedido</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .mobile-container {
            width: 100%;
            max-width: 414px;
            background-color: #ffffff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .header-top {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }

        .title-area {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-thumb {
            width: 48px;
            height: 48px;
            background: #fff8eb;
            border: 1px solid #ffeeba;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .item-text h4 {
            font-size: 14px;
            color: #111;
            font-weight: 600;
        }

        .item-text span {
            font-size: 12px;
            color: #666;
        }

        .counter-control {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 4px;
            gap: 8px;
        }

        .btn-action {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-trash { background: #fff0f0; color: #d9534f; }
        .btn-plus { background: #ff6b00; color: white; font-size: 16px; }
        .counter-num { font-weight: 600; font-size: 14px; color: #333; padding: 0 4px; }

        .obs-box label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        .obs-textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #333;
            resize: none;
            height: 70px;
            background: #fafafa;
        }

        .finance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .finance-row span:first-child { font-size: 13px; color: #666; }
        .finance-row span:last-child { font-size: 14px; font-weight: 700; color: #111; }
        .finance-total { font-size: 16px !important; color: #111; }

        .btn-confirm {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-top: 4px;
        }

        .btn-confirm:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header-top">← Voltar ao cardápio</div>
        <div class="title-area">Resumo do pedido • Mesa 04</div>

        <!-- Card de Item -->
        <div class="card">
            <div class="card-header-row">
                <span>ITENS DO SEU PEDIDO</span>
                <span>1 item</span>
            </div>
            <div class="item-row">
                <div class="item-info">
                    <div class="item-thumb">🍺</div>
                    <div class="item-text">
                        <h4>1x Cerveja 600ml</h4>
                        <span>Unitário: R$ 12,00</span>
                    </div>
                </div>
                <div class="counter-control">
                    <button class="btn-action btn-trash">🗑️</button>
                    <span class="counter-num">1</span>
                    <button class="btn-action btn-plus">+</button>
                </div>
            </div>
        </div>

        <!-- Card de Observação -->
        <div class="card obs-box">
            <label>Observações do pedido (ex: copo de gelo)</label>
            <textarea class="obs-textarea">Trazer copo com bastante gelo.</textarea>
        </div>

        <!-- Card Financeiro -->
        <div class="card">
            <div class="finance-row" style="margin-bottom: 8px;">
                <span>Mesa de atendimento</span>
                <span>Geisa Bar • Mesa 04</span>
            </div>
            <hr style="border: none; border-top: 1px solid #eee; margin: 8px 0;">
            <div class="finance-row">
                <span>Resumo financeiro</span>
                <span class="finance-total">Total: R$ 12,00</span>
            </div>
        </div>

        <!-- Botão Final -->
        <button class="btn-confirm">Confirmar e enviar o pedido ✓</button>
    </div>

</body>
</html>
